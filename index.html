  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 1. Safeguard against circular structures in JSON.stringify (e.g. SolanaMobileWalletAdapter EventEmitter cycles)
      (function() {
        try {
          var originalStringify = JSON.stringify;
          JSON.stringify = function(value, replacer, space) {
            var seen = new WeakSet();
            return originalStringify(value, function(key, val) {
              if (typeof val === 'object' && val !== null) {
                if (seen.has(val)) {
                  // Prevent circular reference crashes
                  return undefined;
                }
                seen.add(val);
              }
              if (typeof replacer === 'function') {
                return replacer.call(this, key, val);
              }
              return val;
            }, space);
          };
        } catch (e) {
          // pass
        }

        // 2. Clear any stale wallet session on hard reload if it prevents connection
        if (window.performance && window.parent !== window) {
           // In iframes, stale localStorage can sometimes block the wallet-adapter handshake
           // but we should be careful not to wipe user settings unnecessarily.
        }

        // 3. Safeguard against scripts trying to set window.fetch when window.fetch has only a getter
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = function(input, init) {
            try {
              if (!originalFetch) return Promise.reject(new Error('Fetch not available'));
              return originalFetch(input, init).catch(function(err) {
                var errStr = (err && (err.message || err.toString())) || '';
                if (/Local Network Access/i.test(errStr)) {
                  console.warn('[Local Network Access Handled]:', errStr);
                  return new Response(JSON.stringify({ error: 'Local network access blocked' }), {
                    status: 503,
                    headers: { 'Content-Type': 'application/json' }
                  });
                }
                return Promise.reject(err);
              });
            } catch (e) {
              return Promise.reject(e);
            }
          };

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // pass
        }

        // 4. Bypass Local Network Access restrictions in sandboxed iframes & Chromium
        try {
          if (typeof navigator !== 'undefined') {
            // Grant loopback-network / local-network-access permission queries
            if (navigator.permissions && navigator.permissions.query) {
              var originalPermissionsQuery = navigator.permissions.query.bind(navigator.permissions);
              navigator.permissions.query = function(descriptor) {
                if (
                  descriptor &&
                  (descriptor.name === 'loopback-network' ||
                   descriptor.name === 'local-network' ||
                   descriptor.name === 'local-network-access' ||
                   descriptor.name === 'private-network-access')
                ) {
                  return Promise.resolve({
                    state: 'granted',
                    name: descriptor.name,
                    onchange: null,
                    addEventListener: function() {},
                    removeEventListener: function() {},
                    dispatchEvent: function() { return false; }
                  });
                }
                return originalPermissionsQuery(descriptor);
              };
            }
            // Safeguard WebSocket constructor for local loopback connections
            if (typeof window !== 'undefined' && window.WebSocket) {
              var OriginalWebSocket = window.WebSocket;
              var SafeWebSocket = function(url, protocols) {
                try {
                  return protocols !== undefined
                    ? new OriginalWebSocket(url, protocols)
                    : new OriginalWebSocket(url);
                } catch (err) {
                  var errStr = (err && (err.message || err.toString())) || '';
                  if (/Local Network Access|permission|not allowed|wallet session was closed/i.test(errStr)) {
                    console.warn('[Local WebSocket connection blocked gracefully]:', errStr);
                    var fallbackTarget = new EventTarget();
                    fallbackTarget.readyState = 3; // CLOSED
                    fallbackTarget.close = function() {};
                    fallbackTarget.send = function() {};
                    return fallbackTarget;
                  }
                  throw err;
                }
              };
              SafeWebSocket.prototype = OriginalWebSocket.prototype;
              SafeWebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
              SafeWebSocket.OPEN = OriginalWebSocket.OPEN;
              SafeWebSocket.CLOSING = OriginalWebSocket.CLOSING;
              SafeWebSocket.CLOSED = OriginalWebSocket.CLOSED;
              window.WebSocket = SafeWebSocket;
            }
          }
        } catch (e) {
          // pass
        }

        // 5. Global unhandled rejection & error listeners for wallet sessions & Local Network Access (capture phase)
        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reason = event.reason;
            var msg = (reason && (reason.message || reason.toString())) || '';
            var name = (reason && reason.name) || '';
            if (
              /The wallet session was closed/i.test(msg) ||
              /session was closed before connection/i.test(msg) ||
              /wallet session/i.test(msg) ||
              /User rejected/i.test(msg) ||
              /User cancelled/i.test(msg) ||
              /Wallet connection cancelled/i.test(msg) ||
              /Local Network Access/i.test(msg) ||
              name === 'SolanaMobileWalletAdapterError' ||
              name === 'WalletConnectionError' ||
              name === 'WalletWindowClosedError' ||
              name === 'WalletTimeoutError' ||
              (reason && reason.name === 'NotAllowedError' && /network|permission/i.test(msg))
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              console.info('[Handled wallet session rejection gracefully]:', msg || name);
            }
          } catch (_) {}
        }, true);

        window.addEventListener('error', function(event) {
          try {
            var msg = event.message || (event.error && event.error.message) || '';
            var name = (event.error && event.error.name) || '';
            if (
              /The wallet session was closed/i.test(msg) ||
              /session was closed before connection/i.test(msg) ||
              /wallet session/i.test(msg) ||
              /User rejected/i.test(msg) ||
              /User cancelled/i.test(msg) ||
              /Wallet connection cancelled/i.test(msg) ||
              /Local Network Access/i.test(msg) ||
              name === 'SolanaMobileWalletAdapterError' ||
              name === 'WalletConnectionError' ||
              name === 'WalletWindowClosedError' ||
              name === 'WalletTimeoutError'
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              console.info('[Handled wallet session error gracefully]:', msg || name);
              return true;
            }
          } catch (_) {}
        }, true);
      })();
    </script>
    <title>100% True On-Chain Web3 - Solana AI NFT Marketplace & Creator Engine</title>

    <meta property="og:type" content="website" />
